<title id="inlet-works-pid-title">Fine screening, duty and standby</title>
<desc id="inlet-works-pid-desc">Raw sewage passes flow meter FIT-1 into the stilling chamber, splits across two mechanical fine screens on duty, each with a level transmitter either side (LIT-1 to LIT-4) and the difference computed as DLT-1 and DLT-2, while the manual channel stands by behind closed slide gates. Two grit chambers collect the screened flow for the SBR basins.</desc>
